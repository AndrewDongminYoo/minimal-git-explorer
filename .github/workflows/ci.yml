name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundle
        run: pnpm run package
      - name: Package VSIX
        run: pnpm run vsix

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode-version:
          - 1.74.0
          - stable
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run extension tests
        run: xvfb-run -a pnpm test
