allowBuilds:
  "@vscode/vsce-sign": true # postinstall marks the bundled signing binary executable
  esbuild: true
  keytar: true # prebuild-install fetches a prebuilt binary; node-gyp is only the fallback

minimumReleaseAgeExclude:
  - "@azure/msal-common@16.15.0"
  - "@azure/msal-node@7.1.2"

# Migrated from the "pnpm.overrides" field in package.json, which pnpm 11 no
# longer reads ("The pnpm field in package.json is no longer read by pnpm").
overrides:
  # Mocha 11 declares diff 7 and serialize-javascript 6, which have no patched line.
  # Keep the existing security exceptions limited to that consumer.
  mocha@11>diff: ^8.0.4 # GHSA-73rr-hh4g-fpgx
  mocha@11>serialize-javascript: ^7.1.4 # GHSA-m5mm-p8h7-m29v
  shell-quote@1: ^1.12.0 # GHSA-pqg4-j6r4-53mv
  "@azure/identity@4>@azure/msal-node": ^7.1.2 # GHSA-xcx6-jx8p-x3h5; offline API and packaging checks
  brace-expansion@1: ^1.1.21 # GHSA-q2hr-2g5m-vwhr
  brace-expansion@2: ^2.1.7 # GHSA-q2hr-2g5m-vwhr
  brace-expansion@5: ^5.0.12 # GHSA-q2hr-2g5m-vwhr
  js-yaml@4: ^4.3.2 # GHSA-2883-xcg3-v3hh
