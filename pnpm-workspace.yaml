allowBuilds:
  "@vscode/vsce-sign": true # postinstall marks the bundled signing binary executable
  esbuild: true
  keytar: true # prebuild-install fetches a prebuilt binary; node-gyp is only the fallback

# Migrated from the "pnpm.overrides" field in package.json, which pnpm 11 no
# longer reads ("The pnpm field in package.json is no longer read by pnpm").
overrides:
  diff: ^8.0.3
  serialize-javascript: ^7.0.5
  shell-quote: ^1.9.0 # GHSA-395f-4hp3-45gv
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.7
  fast-uri: ^3.1.4
  form-data@4: ^4.0.6
  js-yaml@4: ^4.3.0
  linkify-it@5: ^5.0.2
  undici@7: ^7.28.0
